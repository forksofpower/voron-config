# Single-tool start and end. No dock moves and no toolchanger calls.

[gcode_macro PRINT_START]
gcode:
  {% set bed = params.BED_TEMP|default(60)|float %}
  {% set hotend = params.EXTRUDER_TEMP|default(params.TOOL_TEMP|default(200))|float %}
  M140 S{bed}
  G28
  M190 S{bed}
  QUAD_GANTRY_LEVEL
  G28 Z
  BED_MESH_PROFILE LOAD=default
  G90
  G1 X175 Y175 Z10 F6000
  M109 S{hotend}

[gcode_macro PRINT_END]
gcode:
  M400
  G92 E0
  G1 E-2 F1800
  G91
  G0 Z10 F600
  G90
  TURN_OFF_HEATERS
  M107
  M84
