# Single toolhead. Nitehawk-SB on USB. No toolchanger sections.
[mcu nhk]
serial: /dev/serial/by-id/usb-Klipper_rp2040_4D4A3933361682AF-if00
restart_method: command

[extruder]
step_pin: nhk:gpio23
dir_pin: nhk:gpio24
enable_pin: !nhk:gpio25
rotation_distance: 47.554
gear_ratio: 9:1
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: nhk:gpio9
sensor_type: PT1000
sensor_pin: nhk:gpio29
pullup_resistor: 2200
min_temp: 10
max_temp: 500
max_power: 1.0
min_extrude_temp: 170
max_extrude_only_distance: 150
max_extrude_cross_section: 2.0
control: pid
pid_kp: 26.213
pid_ki: 1.304
pid_kd: 131.721
pressure_advance: 0.03
pressure_advance_smooth_time: 0.020

[tmc2209 extruder]
uart_pin: nhk:gpio0
tx_pin: nhk:gpio1
interpolate: false
run_current: 0.6
sense_resistor: 0.100
stealthchop_threshold: 0

[fan]
pin: nhk:gpio6
kick_start_time: 1
off_below: 0.10

[heater_fan hotend_fan]
pin: nhk:gpio5
max_power: 1.0
heater: extruder
heater_temp: 50.0
kick_start_time: 0.5

[probe]
pin: !nhk:gpio10
x_offset: 0
y_offset: 0
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3

[thermistor CMFB103F3950FANT]
temperature1: 0.0
resistance1: 32116.0
temperature2: 40.0
resistance2: 5309.0
temperature3: 80.0
resistance3: 1228.0

[temperature_sensor nh_temp0]
sensor_type: CMFB103F3950FANT
sensor_pin: nhk:gpio26
pullup_resistor: 2200
min_temp: 0
max_temp: 100

[temperature_sensor chamber_temp]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nhk:gpio28
min_temp: 0
max_temp: 100
pullup_resistor: 5500

[adxl345 toolhead]
cs_pin: nhk:gpio21
spi_software_sclk_pin: nhk:gpio18
spi_software_mosi_pin: nhk:gpio20
spi_software_miso_pin: nhk:gpio19
axes_map: x,z,y
